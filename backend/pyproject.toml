[project]
name = "car-classifier-backend"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "faiss-cpu>=1.15.1",
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "numpy>=2.2.6",
    "onnxruntime>=1.20.0",
    "pillow>=12.3.0",
    "pydantic-settings>=2.15.0",
    "pytest>=9.1.1",
    "python-multipart>=0.0.32",
    "uvicorn>=0.54.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
