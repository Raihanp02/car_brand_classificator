[project]
name = "car-classifier-backend"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "albumentations>=2.0.8",
    "faiss-cpu>=1.15.1",
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "numpy>=2.2.6",
    "pillow>=12.3.0",
    "pytest>=9.1.1",
    "python-multipart>=0.0.32",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    "transformers>=5.19.0",
    "uvicorn>=0.54.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
