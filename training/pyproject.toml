[project]
name = "car-classifier-training"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "albumentations>=2.0.8",
    "faiss-cpu>=1.15.1",
    "huggingface-hub>=0.20.0",
    "numpy>=2.2.6",
    "onnx>=1.17.0",
    "onnxruntime>=1.20.0",
    "torch==2.6.0+cu126",
    "torchvision==0.21.0+cu126",
    "opencv-python>=4.10.0",
    "pillow>=12.3.0",
    "pytest>=9.1.1",
    "transformers>=5.19.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"